<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>畢業討伐戰：勇者與證書之龍</title>
<style>
:root{--bg:#04060d;--panel:#0a1224;--line:#1b3566;--blue:#3d8bff;--ice:#8fc4ff;--txt:#dce8ff;--mute:#6f86b3;--bad:#ff5d7a;--ok:#46d6a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#0d2150 0,var(--bg) 55%) fixed;color:var(--txt);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:"Noto Serif TC","Songti TC",serif;margin:.2em 0;letter-spacing:.04em}
h1{font-size:2rem;color:var(--ice);text-shadow:0 0 24px #2a6cff88}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}
.mute{color:var(--mute);font-size:.9rem}
button{font:inherit;color:var(--txt);background:#0c1a38;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
button:hover{border-color:var(--blue);background:#10244d}
button:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.main{background:var(--blue);color:#001029;border-color:var(--blue);text-align:center;font-weight:700}
.main:hover{background:var(--ice)}
.bar{height:10px;background:#0b1630;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .5s}
.dragon .bar i{background:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.stats b{display:flex;justify-content:space-between;font-weight:500;font-size:.9rem}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts small{display:block;color:var(--mute);font-size:.78rem}
.big{font-size:3.4rem;line-height:1}
.log{font-size:.9rem;color:var(--mute);max-height:150px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px dashed #12244a}
.q{display:grid;gap:10px;margin-top:12px}
.vs{text-align:center;color:var(--mute);font-size:.8rem}
@media(max-width:420px){.acts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CL={
W:{n:"戰士",e:"⚔️",d:"早起、敢上台、體力過人。正面硬剛一切課業。",s:"熱血：認真上課成績+1，熬夜體力少扣2",st:{h:7,s:3,m:5},b:{0:{g:1},7:{h:2}}},
M:{n:"法師",e:"🔮",d:"愛念書、有筆電、需要安靜。咒文就是公式。",s:"博學：苦讀成績+1，熬夜成績+1 心情+1",st:{h:5,s:2,m:5},b:{1:{g:1},7:{g:1,m:1}}},
R:{n:"盜賊",e:"🗡️",d:"晚八才是真八，後排是戰略位置。效率至上。",s:"夜行：睡覺也能成績+1心情+1，熬夜體力少扣2",st:{h:5,s:3,m:6},b:{4:{g:1,m:1},7:{h:2,m:1}}},
C:{n:"牧師",e:"✨",d:"重視人際，分組報告的守護者，大家的精神支柱。",s:"祝福：組隊成績+1人脈+1，出遊心情體力+1",st:{h:5,s:5,m:5},b:{5:{g:1,s:1},6:{m:1,h:1}}},
B:{n:"吟遊詩人",e:"🎻",d:"手機不離手、音樂不離耳，上台就是舞台。",s:"魅力：社團與出遊人脈、心情+1",st:{h:5,s:5,m:5},b:{2:{s:1,m:1},6:{m:1,s:1}}}};
const Q=[
["早八 vs 晚八，你寧願選哪一個？","早八","WM","晚八","R"],
["期中考 vs 分組報告，哪個比較痛苦？","期中考比較痛苦","C","分組報告比較痛苦","MR"],
["上課坐哪裡？","前排","M","後排","R"],
["空堂時你會…","補眠","RW","去吃東西","C"],
["報告你比較想當…","上台的人","WB","做簡報的人","MR"],
["大學生最不能沒有…","手機","CB","筆電","M"],
["讀書時…","要有音樂","BR","一定要安靜","MW"],
["考試準備方式","考前一週開始準備","WM","考前一晚爆肝","R"],
["大學生活比較重要的是…","成績","M","人際關係","CB"],
["如果今天突然停課一天…","回家睡覺","RW","馬上約朋友出去玩","CB"]];
const A=[
{n:"認真上課",e:"📖",f:{g:3,h:-1,s:0,m:0}},
{n:"圖書館苦讀",e:"📚",f:{g:4,h:-2,s:0,m:-1}},
{n:"社團活動",e:"🎪",f:{g:-1,h:-1,s:3,m:1}},
{n:"打工賺錢",e:"💰",f:{g:0,h:-1,s:1,m:1}},
{n:"睡飽飽",e:"🛌",f:{g:-1,h:3,s:0,m:1}},
{n:"組隊刷副本",e:"🤝",f:{g:2,h:-1,s:2,m:-1}},
{n:"約朋友出遊",e:"🎉",f:{g:-1,h:-1,s:1,m:3}},
{n:"熬夜爆肝",e:"🌙",f:{g:5,h:-3,s:0,m:-2}}];
const EV=[
["教授突然公布超大範圍期中考",{g:-1,m:-1}],["學長姐送你歷屆考古題",{g:2}],["重感冒躺了一週",{h:-2}],
["社團聚餐認識新朋友",{s:2}],["突然停課一天！",{m:2,h:1}],["分組遇到神隊友",{g:1,s:1}],
["分組遇到雷隊友",{m:-2,g:-1}],["校園美食街開幕",{m:1,h:1}],["電腦當機，報告檔案不見",{m:-2}]];
const SM=["大一上","大一下","大二上","大二下","大三上","大三下","大四上","大四下"];
const app=document.getElementById("app");
let qi,sc,cls,t,S,log;
const cl=(v,a=0,b=10)=>Math.max(a,Math.min(b,v));
const eff=()=>S.g+Math.floor(S.s/3);
function home(){
app.innerHTML=`<h1>畢業討伐戰</h1><p class="mute">惡龍盤據在畢業證書上。先做個心理測驗，看看你是哪個職業的勇者，再用八個學期的選擇，決定能不能打倒它。</p>
<div class="card"><p>10 題二選一，沒有標準答案，憑直覺選。</p><button class="main" onclick="startQ()">開始測驗</button></div>`}
function startQ(){qi=0;sc={W:0,M:0,R:0,C:0,B:0};showQ()}
function showQ(){
const q=Q[qi];
app.innerHTML=`<p class="mute">第 ${qi+1} / 10 題</p><div class="bar"><i style="width:${qi*10}%"></i></div>
<h2 style="margin-top:20px">${q[0]}</h2><div class="q"><button onclick="pick('${q[2]}')">${q[1]}</button><div class="vs">或</div><button onclick="pick('${q[4]}')">${q[3]}</button></div>`}
function pick(s){for(const c of s)sc[c]++;qi++;qi<10?showQ():reveal()}
function reveal(){
cls=Object.keys(sc).reduce((a,b)=>sc[b]>sc[a]?b:a);const c=CL[cls];
app.innerHTML=`<p class="mute">你的職業是</p><div class="card" style="text-align:center"><div class="big">${c.e}</div><h1>${c.n}</h1><p>${c.d}</p><p class="mute">專屬技能　${c.s}</p></div>
<button class="main" onclick="startGame()">踏上討伐之路</button>`}
function startGame(){t=0;log=[];const c=CL[cls];S={g:0,h:c.st.h,s:c.st.s,m:c.st.m};play()}
function stat(l,v,mx=10){return `<div><b><span>${l}</span><span>${v}</span></b><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`}
function play(msg){
const hp=Math.max(0,100-eff()*3);
app.innerHTML=`<p class="mute">${CL[cls].e} ${CL[cls].n}　${SM[t]}（${t+1} / 8）</p>
<div class="card dragon"><b>🐉 證書之龍</b><div class="bar" style="margin-top:6px"><i style="width:${hp}%"></i></div><div class="mute">龍的血量 ${hp} / 100</div></div>
<div class="card stats">${stat("成績",Math.min(S.g,40),40)}${stat("人脈",S.s)}${stat("體力",S.h)}${stat("心情",S.m)}</div>
${msg?`<div class="card">${msg}</div>`:""}
<p>這學期你要做什麼？</p><div class="acts">${A.map((a,i)=>`<button onclick="act(${i})">${a.e} ${a.n}<small>${fx(a.f)}</small></button>`).join("")}</div>
<div class="card log">${log.map(l=>`<div>${l}</div>`).join("")||"紀錄會顯示在這裡"}</div>`}
function fx(f){const k={g:"成績",s:"人脈",h:"體力",m:"心情"};return Object.keys(f).filter(x=>f[x]).map(x=>k[x]+(f[x]>0?"+":"")+f[x]).join(" ")}
function add(f){for(const k in f)S[k]=k=="g"?Math.max(0,S.g+f[k]):cl(S[k]+f[k])}
function act(i){
const a=A[i],f={...a.f},b=CL[cls].b[i]||{};
for(const k in b)f[k]=(f[k]||0)+b[k];
add(f);
const ev=EV[Math.floor(Math.random()*EV.length)];add(ev[1]);
let out=`${a.e}${a.n}（${fx(f)}）<br>🎲 事件：${ev[0]}（${fx(ev[1])}）`;
if(S.h<=0||S.m<=0){S.g=Math.max(0,S.g-3);if(S.h<=0)S.h=3;if(S.m<=0)S.m=3;out+=`<br><span style="color:var(--bad)">體力或心情見底，被迫休息調養，成績-3。</span>`}
log.unshift(`${SM[t]}：${a.n}／${ev[0]}`);
t++;
t<8?play(out):end()}
function end(){
const e=eff();let r;
if(e>=30)r=["🏆","優等畢業","惡龍倒下，證書閃耀著光。你不只畢業，還帶著好成績與好朋友離開。"];
else if(e>=22)r=["🎓","順利畢業","一劍封喉！你拿到了畢業證書，四年的旅程圓滿結束。"];
else if(e>=16)r=["⏳","延畢一年","惡龍還剩一口氣，你只能多留一年，再戰一次。"];
else r=["💀","被惡龍擊退","證書仍在龍的巢穴裡。別灰心，下一位勇者會更強。"];
const hp=Math.max(0,100-e*3);
app.innerHTML=`<div class="card" style="text-align:center"><div class="big">${r[0]}</div><h1>${r[1]}</h1><p>${r[2]}</p>
<p class="mute">最終戰力 ${e}（成績 ${S.g} ＋ 人脈加成 ${Math.floor(S.s/3)}）／龍剩餘血量 ${hp}</p></div>
<div class="card stats">${stat("成績",Math.min(S.g,40),40)}${stat("人脈",S.s)}${stat("體力",S.h)}${stat("心情",S.m)}</div>
<div class="card log">${log.slice().reverse().map(l=>`<div>${l}</div>`).join("")}</div>
<button class="main" onclick="startGame()">用同職業再戰一次</button><div style="height:8px"></div><button class="main" onclick="startQ()">重新測驗換職業</button>`}
home();
</script>
</body>
</html>
